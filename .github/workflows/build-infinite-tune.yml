name: Build INFINITE TUNE

# Metrolist fork -> INFINITE TUNE.
#
# Rebranding needs NO source edits: Metrolist's build.gradle.kts already reads
# METROLIST_APP_NAME and METROLIST_APPLICATION_ID from the environment.
#
# The icons are GENERATED here from a single logo.png in the repo root, so you
# never have to upload 15 separate image files from a phone.

on:
  workflow_dispatch:      # manual "Run workflow" button
  push:
    branches: [main, master]

env:
  # ---- your app name and id ----
  METROLIST_APP_NAME: "INFINITE TUNE"
  METROLIST_APPLICATION_ID: "com.infinitetune.music"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Generate every launcher icon from logo.png (if that file exists).
      # Skipped automatically when logo.png is absent, so the build still
      # works before you have uploaded it.
      # ------------------------------------------------------------------
      - name: Generate app icons from logo.png
        run: |
          if [ ! -f logo.png ]; then
            echo "::notice::logo.png not found in repo root - keeping stock Metrolist icons."
            exit 0
          fi
          python3 -m pip install --quiet --upgrade Pillow
          python3 .github/scripts/make_icons.py

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      # FOSS flavor = no Google Cast dependency. Best choice for a phone build.
      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out
          for f in *.apk; do
            mv "$f" "InfiniteTune-${f}" 2>/dev/null || true
          done
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteTune-APK
          path: out/*.apk
          retention-days: 30
