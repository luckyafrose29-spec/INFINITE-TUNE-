#Minecraft server properties - INFINITE-TUNE
#Tuned for a small 4-5 friend group running on Hugging Face Spaces (16GB RAM)
#NOTE: itzg/minecraft-server regenerates/overrides this file from the
#      Dockerfile ENV vars on every boot (OVERRIDE_SERVER_PROPERTIES=true by
#      default), so keep the two in sync if you change settings here.

# --- Performance / network tuning ---
view-distance=8
simulation-distance=6
max-players=5
network-compression-threshold=256
entity-broadcast-range-percentage=100

# --- Gameplay ---
allow-flight=true
enable-command-block=true
online-mode=false
pvp=true
difficulty=normal
gamemode=survival
spawn-protection=0
allow-nether=true
hardcore=false
force-gamemode=false
white-list=false
enforce-whitelist=false

# --- World ---
level-name=world
level-type=minecraft\:normal
generate-structures=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true

# --- Server identity / misc ---
motd=INFINITE-TUNE Server - Purpur on Hugging Face
server-port=25565
enable-status=true
enable-query=false
enable-rcon=false
op-permission-level=4
function-permission-level=2
max-world-size=29999984
max-tick-time=60000
require-resource-pack=false
sync-chunk-writes=true
use-native-transport=true
